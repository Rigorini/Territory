<div class="page-head">
  <h2>{{ 'nav.publishers' | translate }}</h2>
  <button mat-stroked-button class="mobile-only" (click)="filtersOpen.set(!filtersOpen())" [attr.aria-expanded]="filtersOpen()">
    <mat-icon>filter_list</mat-icon>{{ 'common.filters' | translate }}
  </button>
  <button mat-flat-button (click)="openDialog()">
    <mat-icon>person_add</mat-icon>{{ 'publishers.add' | translate }}
  </button>
</div>

@if (publishers.loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-wrap">
  <table mat-table [dataSource]="paging.rows()" matSort matSortActive="lastName" matSortDirection="asc"
         (matSortChange)="table.onSort($event)" class="responsive-table" [class.filters-open]="filtersOpen()">

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'publishers.lastName' | translate }}</th>
      <td mat-cell *matCellDef="let p" [attr.data-label]="'publishers.lastName' | translate">{{ p.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'publishers.firstName' | translate }}</th>
      <td mat-cell *matCellDef="let p" [attr.data-label]="'publishers.firstName' | translate">{{ p.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef><span class="sr-only">{{ 'common.actions' | translate }}</span></th>
      <td mat-cell *matCellDef="let p" class="actions">
        <button mat-icon-button class="act-edit" (click)="openDialog(p)" [matTooltip]="'common.edit' | translate"
                [attr.aria-label]="'common.edit' | translate">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button class="act-delete" (click)="confirmDelete(p)" [matTooltip]="'common.delete' | translate"
                [attr.aria-label]="'common.delete' | translate">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="f-lastName">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [label]="'publishers.lastName' | translate" [value]="table.filter('lastName')"
                           (valueChange)="table.setFilter('lastName', $event)" />
      </th>
    </ng-container>
    <ng-container matColumnDef="f-firstName">
      <th mat-header-cell *matHeaderCellDef>
        <app-column-filter [label]="'publishers.firstName' | translate" [value]="table.filter('firstName')"
                           (valueChange)="table.setFilter('firstName', $event)" />
      </th>
    </ng-container>
    <ng-container matColumnDef="f-actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button (click)="table.clearFilters()" [disabled]="!table.hasFilters()">{{ 'common.clearFilters' | translate }}</button>
      </th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns" class="labels"></tr>
    <tr mat-header-row *matHeaderRowDef="filterColumns" class="filters"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
    <tr class="mat-row no-data" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="columns.length">{{ 'common.noResults' | translate }}</td>
    </tr>
  </table>
</div>

<app-list-paginator [paging]="paging" />
