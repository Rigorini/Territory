<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Territori</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gestione dei territori e delle assegnazioni della congregazione." />
    <meta name="theme-color" content="#0b57d0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1020" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Territori" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link
      rel="preload"
      href="fonts/material-symbols-icons-674854DD.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script src="splash.js" defer></script>
    <style>
      /* Bootstrap splash: inline so it paints before any stylesheet or bundle is downloaded. */
      html,
      body {
        margin: 0;
      }

      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background:
          radial-gradient(120% 70% at 50% -10%, rgba(94, 148, 255, 0.55), transparent 62%),
          linear-gradient(158deg, #0b2a69 0%, #0b57d0 52%, #092052 100%);
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
        transition:
          opacity 0.4s ease,
          visibility 0s linear 0.4s;
      }

      .app-splash::before {
        content: '';
        position: absolute;
        top: -20vmax;
        left: 50%;
        width: 70vmax;
        height: 70vmax;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.12), transparent 65%);
        transform: translateX(-50%);
        pointer-events: none;
      }

      .app-splash__inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }

      .app-splash__logo {
        position: relative;
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        margin-bottom: 26px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        animation: app-splash-breathe 2.6s ease-in-out infinite;
      }

      .app-splash__logo > svg {
        width: 50px;
        height: 50px;
      }

      .app-splash__title {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.2px;
        line-height: 1.2;
      }

      .app-splash__subtitle {
        margin: 5px 0 0;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.3px;
        opacity: 0.72;
      }

      .app-splash__progress {
        width: min(240px, 62vw);
        height: 3px;
        margin: 30px 0 16px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
      }

      .app-splash__progress span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), #fff, rgba(255, 255, 255, 0.2));
        animation: app-splash-bar 1.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }

      .app-splash__phase {
        min-height: 20px;
        margin: 0;
        font-size: 13px;
        line-height: 20px;
        opacity: 0.85;
      }

      .app-splash__retry {
        margin-top: 14px;
        padding: 9px 22px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .app-splash__retry:hover,
      .app-splash__retry:focus-visible {
        background: rgba(255, 255, 255, 0.24);
      }

      .app-splash--error .app-splash__progress {
        display: none;
      }

      .app-splash--error .app-splash__logo {
        animation: none;
        border-color: rgba(255, 255, 255, 0.45);
      }

      .app-splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes app-splash-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.035);
        }
      }

      @keyframes app-splash-bar {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash,
        .app-splash * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <app-root></app-root>

    <div id="app-splash" class="app-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="app-splash__inner">
        <div class="app-splash__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#ffffff"
              d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"
            />
          </svg>
        </div>
        <h1 class="app-splash__title">Territori</h1>
        <p id="app-splash-subtitle" class="app-splash__subtitle">Registro territori</p>
        <div class="app-splash__progress" aria-hidden="true"><span></span></div>
        <p id="app-splash-phase" class="app-splash__phase">Avvio dell’applicazione…</p>
        <button id="app-splash-retry" type="button" class="app-splash__retry" hidden>Riprova</button>
      </div>
    </div>

    <noscript>
      <div style="position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #0b2a69; color: #fff; font-family: system-ui, sans-serif; text-align: center">
        <p>Territori richiede JavaScript per funzionare. Abilitalo nel browser e ricarica la pagina.<br />Territori requires JavaScript. Enable it in your browser and reload the page.</p>
      </div>
    </noscript>
  </body>
</html>
