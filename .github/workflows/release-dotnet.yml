name: Build & Release .NET

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_publish_zip_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Territory.slnx

      - name: Build
        run: dotnet build Territory.slnx -c Release --no-restore

      - name: Publish
        run: dotnet publish src/Territory.Api/Territory.Api.csproj -c Release -o ./publish --no-build

      - name: Zip publish folder
        run: |
          cd publish
          zip -r "../Territory ${{ github.ref_name }}.zip" .

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: "Territory ${{ github.ref_name }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
